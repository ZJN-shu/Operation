name: CI

# 触发：推送到 main、针对 main 的 PR、以及手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 说明：本流水线刻意保留项目当前已知的 5 个失败用例（后端 4 / 前端 1，
# 分别对应课程奖励资格、SSE 会话撤销、SSE 晚提交、断线重连补拉）。
# 这里不用 continue-on-error / skip 去掩盖它们——红就是红，作为“修复前不放行”的门禁。

jobs:
  lint:
    name: 静态检查（语法）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python 字节码编译检查
        run: python -m compileall -q portal/backend portal/tests
      - name: 前端 JS 语法检查
        run: node --check portal/static/app.js

  frontend:
    name: 前端行为测试（node，零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行前端断言（含 1 个已知失败，故意让本 job 变红）
        run: node portal/tests/test_frontend.js

  backend:
    name: 后端与数据库集成测试（真实 MySQL）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r portal/requirements.txt

      - name: 安装 MySQL（供 run_mysql.py 自行拉起临时实例）
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server

      - name: 定位 mysqld 并注入 PORTAL_TEST_MYSQLD
        run: |
          BIN="$(command -v mysqld || true)"
          if [ -z "$BIN" ]; then BIN="/usr/sbin/mysqld"; fi
          echo "PORTAL_TEST_MYSQLD=$BIN" >> "$GITHUB_ENV"
          echo "使用 mysqld: $BIN"

      - name: 运行数据库集成测试（含 4 个已知失败，故意让本 job 变红）
        run: python -m portal.tests.run_mysql

      # 兜底说明：若上面的 mysqld 因 runner 权限 / AppArmor 起不来，
      # 可改用 GitHub 的 services: mysql，并给 run_mysql.py 增加“连外部实例”模式。
