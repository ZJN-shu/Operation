name: CI

# 触发：推送到 main、针对 main 的 PR、以及手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 说明：本流水线曾刻意保留 5 个已知失败用例（后端 4 / 前端 1，分别对应
# 课程奖励资格、SSE 会话撤销、SSE 晚提交、断线重连补拉），不用 continue-on-error
# 掩盖，作为"修复前不放行"的门禁。
# 这 5 处已随后续提交修复：完成课程先校验报名资格、SSE 每帧外发前复查会话、
# 水位 gap-aware 推进 + 批次越洞、断线重连补拉快照。本地实测后端 100 项、
# 前端 107 断言全通过，门禁恢复为"全绿才放行"。

jobs:
  lint:
    name: 静态检查（语法）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python 字节码编译检查
        run: python -m compileall -q portal/backend portal/tests
      - name: 前端 JS 语法检查
        run: node --check portal/static/app.js

  frontend:
    name: 前端行为测试（node，零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        run: node portal/tests/test_frontend.js

  backend:
    name: 后端与数据库集成测试（真实 MySQL）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r portal/requirements.txt

      - name: 安装 MySQL（供 run_mysql.py 自行拉起临时实例）
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server

      - name: 定位 mysqld 并注入 PORTAL_TEST_MYSQLD
        run: |
          BIN="$(command -v mysqld || true)"
          if [ -z "$BIN" ]; then BIN="/usr/sbin/mysqld"; fi
          echo "PORTAL_TEST_MYSQLD=$BIN" >> "$GITHUB_ENV"
          echo "使用 mysqld: $BIN"

      - name: 运行数据库集成测试（真实 MySQL）
        run: python -m portal.tests.run_mysql

      # 兜底说明：若上面的 mysqld 因 runner 权限 / AppArmor 起不来，
      # 可改用 GitHub 的 services: mysql，并给 run_mysql.py 增加“连外部实例”模式。
